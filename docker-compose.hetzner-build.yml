version: "3.9"
# docker-compose.hetzner-build.yml
# Hetzner-specific build context and volume overrides.
#
# On Hetzner the repo is cloned under a parent directory (e.g. /home/avi/them/).
# Build contexts point to .. (parent) so Dockerfiles are found correctly when
# compose is run from inside a repo subdirectory on the server.
#
# Runtime volume mounts override .:/app → ..:/app so the full source tree is
# mounted into containers at development time instead of only the immediate
# compose directory.

services:
  them-bridge:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/app
      - them-logs:/app/logs

  them-bridge-2:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/app
      - them-logs:/app/logs

  them-worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    volumes:
      - ..:/app
      - them-logs:/app/logs

  them-go-bridge:
    build:
      context: ..
      dockerfile: Dockerfile.go

  them-go-bridge-2:
    build:
      context: ..
      dockerfile: Dockerfile.go

  them-go-worker:
    build:
      context: ..
      dockerfile: Dockerfile.go-worker

  them-go-worker-2:
    build:
      context: ..
      dockerfile: Dockerfile.go-worker

  them-auth-service:
    build:
      context: ../auth_service
      dockerfile: Dockerfile

  them-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

  vision-agent:
    build:
      context: ../agents/vision_agent
      dockerfile: Dockerfile

  a2a-echo:
    build:
      context: ../agents/a2a_echo
      dockerfile: Dockerfile

  a2a-slow:
    build:
      context: ../agents/a2a_slow
      dockerfile: Dockerfile

  a2a-stream:
    build:
      context: ../agents/a2a_stream
      dockerfile: Dockerfile

  agent-evidence:
    build:
      context: ../agents/debate/agent_evidence
      dockerfile: Dockerfile

  agent-logic:
    build:
      context: ../agents/debate/agent_logic
      dockerfile: Dockerfile

  agent-creative:
    build:
      context: ../agents/debate/agent_creative
      dockerfile: Dockerfile

  agent-judge:
    build:
      context: ../agents/debate/agent_judge
      dockerfile: Dockerfile

  # Override Traefik config path to parent directory on Hetzner.
  them-traefik:
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Postgres and Redis config files also live in the parent, not the sparse overlay.
  them-postgres:
    volumes:
      - them-postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d

  them-redis:
    volumes:
      - them-redis-data:/data
      - ../redis/config/redis.conf:/etc/redis/redis.conf:ro
