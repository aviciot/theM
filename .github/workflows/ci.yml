name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: go/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  docs-lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Front matter, owns paths, dead doc links
        run: python3 scripts/docs_lint.py check

      - name: INDEX.md is up to date
        run: |
          python3 scripts/docs_lint.py index
          git diff --exit-code docs/INDEX.md

      - name: Generated route and Redis references are up to date
        run: |
          python3 scripts/gen_reference.py routes --check
          python3 scripts/gen_reference.py redis --check

      - name: Changed code has its owning doc updated (pull requests only)
        if: github.event_name == 'pull_request'
        run: python3 scripts/docs_lint.py changed "origin/${{ github.base_ref }}"
