version: "3.9"

# ============================================================
# the-M — Multi-Agent Orchestration Platform
# Fully isolated stack: own Postgres, own Redis, own network.
# ============================================================

networks:
  them-network:
    name: them-network
    driver: bridge
  proxy-network:
    external: true

# No named volumes — all data uses bind-mount folders under ./volumes/
# This ensures data survives container rebuilds and is visible on the host.

services:

  # ============================================================
  # Traefik reverse proxy — path-based routing + LB
  # ============================================================
  them-traefik:
    image: traefik:v3.6
    container_name: them-traefik
    ports:
      - "8088:8088"
      - "127.0.0.1:8089:8089"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-network
      - them-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================
  # the-M Postgres — isolated PG16, DB: them
  # ============================================================
  them-postgres:
    image: postgres:16-alpine
    container_name: them-postgres
    environment:
      POSTGRES_DB: them
      POSTGRES_USER: ${THE_M_DB_USER:-them}
      POSTGRES_PASSWORD: ${THE_M_DB_PASSWORD:-them_secret}
    volumes:
      - ./data/them-postgres/pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${THE_M_DB_USER:-them} -d them"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================
  # the-M Redis — isolated Redis, DB index 0 (we own it entirely)
  # ============================================================
  them-redis:
    image: redis:7-alpine
    container_name: them-redis
    command: redis-server /etc/redis/redis.conf ${THE_M_REDIS_PASSWORD:+--requirepass $THE_M_REDIS_PASSWORD}
    volumes:
      - ./data/them-redis:/data
      - ./redis/config/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # the-M Auth (Go) — user-facing auth service (login/me/refresh/logout)
  # Issues HS256 JWTs signed with THE_M_JWT_SECRET. Reads the auth_service
  # schema in the them DB. Replaced Python them-auth-service (removed Aug 2026).
  # ============================================================
  them-auth-go:
    build:
      context: .
      dockerfile: Dockerfile.auth-go
    container_name: them-auth-go
    expose:
      - "8703"
    environment:
      HOST: "0.0.0.0"
      PORT: "8703"
      DATABASE_HOST: "them-postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "them"
      DATABASE_USER: "${THE_M_DB_USER:-them}"
      DATABASE_PASSWORD: "${THE_M_DB_PASSWORD:-them_secret}"
      JWT_SECRET: "${THE_M_JWT_SECRET:-change-this-jwt-secret}"
      ACCESS_TOKEN_EXPIRY: "${THE_M_ACCESS_TOKEN_EXPIRY:-3600}"
      REFRESH_TOKEN_EXPIRY: "${THE_M_REFRESH_TOKEN_EXPIRY:-604800}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "json"
      THE_M_INSTANCE_ID: "auth-go-1"
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.services.them-auth-go-svc.loadbalancer.server.port=8703"
      - "traefik.http.services.them-auth-go-svc.loadbalancer.healthcheck.path=/health/live"
      - "traefik.http.services.them-auth-go-svc.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.them-auth-go-svc.loadbalancer.healthcheck.timeout=3s"
      # ── /auth/* → Go auth service (parity with the Python /auth mirror). ──
      # The primary UI path is server-to-server via THE_M_AUTH_URL; this router
      # preserves external /auth reachability through Traefik.
      # ROLLBACK: remove this router block (them-auth-go-router).
      - "traefik.http.routers.them-auth-go-router.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.them-auth-go-router.entrypoints=web"
      - "traefik.http.routers.them-auth-go-router.priority=120"
      - "traefik.http.routers.them-auth-go-router.service=them-auth-go-svc"
    networks:
      - them-network
    depends_on:
      them-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8703/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================
  # the-M Bridge — Python orchestrator API (RETIRED — legacy profile only)
  # Python is permanently retired. Start ONLY with: --profile legacy
  # Normal startup and --profile go must NOT start this container.
  # ============================================================
  them-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: them-bridge
    profiles: [legacy]
    expose:
      - "8001"
    volumes:
      - .:/app
      - ./data/them-logs:/app/logs
    environment:
      THE_M_INSTANCE_ID: "bridge-1"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8001"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DATABASE_HOST: "them-postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "them"
      DATABASE_USER: ${THE_M_DB_USER:-them}
      DATABASE_PASSWORD: ${THE_M_DB_PASSWORD:-them_secret}
      REDIS_HOST: "them-redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_ENABLED: "true"
      REDIS_SSL: "false"
      AUTH_SERVICE_URL: "http://them-auth-go:8703"
      SECRET_KEY: ${THE_M_SECRET_KEY:-change-this-secret-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      CORS_ORIGINS: ${THE_M_CORS_ORIGINS:-http://localhost:3111}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: "json"
      TEMPORAL_ENABLED: "true"
      TEMPORAL_HOST: "temporal-frontend:7233"
      TEMPORAL_NAMESPACE: "default"
      TEMPORAL_TASK_QUEUE: "them-orchestration"
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_PUBLIC_URL: "${LIVEKIT_PUBLIC_URL:-ws://localhost:8088/livekit}"
    labels:
      - "traefik.enable=false"
    networks:
      - them-network
      - proxy-network
    depends_on:
      them-postgres:
        condition: service_healthy
      them-redis:
        condition: service_healthy
      them-auth-go:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ============================================================
  # the-M Bridge Replica 2 — enable with: docker compose --profile replica up -d
  # ============================================================
  them-bridge-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: odin-them-bridge:latest
    container_name: them-bridge-2
    profiles: [replica]
    expose:
      - "8001"
    volumes:
      - .:/app
      - ./data/them-logs:/app/logs
    environment:
      THE_M_INSTANCE_ID: "bridge-2"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8001"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DATABASE_HOST: "them-postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "them"
      DATABASE_USER: ${THE_M_DB_USER:-them}
      DATABASE_PASSWORD: ${THE_M_DB_PASSWORD:-them_secret}
      REDIS_HOST: "them-redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_ENABLED: "true"
      REDIS_SSL: "false"
      AUTH_SERVICE_URL: "http://them-auth-go:8703"
      SECRET_KEY: ${THE_M_SECRET_KEY:-change-this-secret-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      CORS_ORIGINS: ${THE_M_CORS_ORIGINS:-http://localhost:3111}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: "json"
      TEMPORAL_ENABLED: "true"
      TEMPORAL_HOST: "temporal-frontend:7233"
      TEMPORAL_NAMESPACE: "default"
      TEMPORAL_TASK_QUEUE: "them-orchestration"
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_PUBLIC_URL: "${LIVEKIT_PUBLIC_URL:-ws://localhost:8088/livekit}"
    labels:
      - "traefik.enable=false"
    networks:
      - them-network
      - proxy-network
    depends_on:
      them-postgres:
        condition: service_healthy
      them-redis:
        condition: service_healthy
      them-auth-go:
        condition: service_healthy
    restart: unless-stopped

  # Mock agents removed in Phase 8.1 — omni_ws transport dropped.
  # All agents must be A2A (a2a_async transport). Use a2a-echo/slow/stream for testing.

  # ============================================================
  # the-M Frontend — Next.js dashboard (port 3200)
  # ============================================================
  them-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: them-frontend
    expose:
      - "3200"
    command: node server.js
    environment:
      NODE_ENV: production
      PORT: "3200"
      HOSTNAME: "0.0.0.0"
      THE_M_API_URL: "http://them-traefik:8088"
      THE_M_AUTH_URL: "http://them-auth-go:8703"
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_BRIDGE_WS_URL: ""
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.them-ui.entrypoints=web"
      - "traefik.http.routers.them-ui.priority=1"
      - "traefik.http.routers.them-ui.service=them-ui-svc"
      - "traefik.http.services.them-ui-svc.loadbalancer.server.port=3200"
    networks:
      - them-network
      - proxy-network
    depends_on:
      them-auth-go:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O/dev/null http://127.0.0.1:3200/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── A2A Test Agents — enable with: docker compose --profile test-agents up -d ─

  a2a-echo:
    build:
      context: ./agents/a2a_echo
      dockerfile: Dockerfile
    container_name: a2a-echo
    profiles: [test-agents]
    expose:
      - "9200"
    environment:
      PORT: "9200"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  a2a-slow:
    build:
      context: ./agents/a2a_slow
      dockerfile: Dockerfile
    container_name: a2a-slow
    profiles: [test-agents]
    expose:
      - "9201"
    environment:
      PORT: "9201"
      SLOW_DELAY_S: "5"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9201/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  a2a-stream:
    build:
      context: ./agents/a2a_stream
      dockerfile: Dockerfile
    container_name: a2a-stream
    profiles: [test-agents]
    expose:
      - "9202"
    environment:
      PORT: "9202"
      WORD_DELAY_S: "0.05"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9202/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Documentation Writer — enable with: docker compose --profile docu up -d ──
  docu-writer:
    build:
      context: ./agents/docu_writer
      dockerfile: Dockerfile
    container_name: docu-writer
    profiles: [docu]
    expose:
      - "9300"
    environment:
      PORT: "9300"
      ANTHROPIC_API_KEY: "${DOCU_WRITER_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9300/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Security Scanner — enable with: docker compose --profile security up -d ──

  them-security-agent:
    build:
      context: ./agents/security_scanner
      dockerfile: Dockerfile
    container_name: them-security-agent
    profiles: [security]
    expose:
      - "9500"
    environment:
      PORT: "9500"
      ANTHROPIC_API_KEY: "${SECURITY_SCANNER_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9500/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Workflow Advisor — enable with: docker compose --profile advisor up -d ────

  them-workflow-advisor:
    build:
      context: ./agents/workflow_advisor
      dockerfile: Dockerfile
    container_name: them-workflow-advisor
    profiles: [advisor]
    expose:
      - "9600"
    environment:
      PORT: "9600"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-6}"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9600/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Debate Agents — enable with: docker compose --profile debate up -d ───────

  agent-evidence:
    build:
      context: ./agents/debate/agent_evidence
      dockerfile: Dockerfile
    container_name: agent-evidence
    profiles: [debate]
    expose:
      - "9401"
    environment:
      PORT: "9401"
      ANTHROPIC_API_KEY: "${DEBATE_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
      MODEL: "claude-haiku-4-5-20251001"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9401/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent-logic:
    build:
      context: ./agents/debate/agent_logic
      dockerfile: Dockerfile
    container_name: agent-logic
    profiles: [debate]
    expose:
      - "9402"
    environment:
      PORT: "9402"
      ANTHROPIC_API_KEY: "${DEBATE_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
      MODEL: "claude-haiku-4-5-20251001"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9402/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent-creative:
    build:
      context: ./agents/debate/agent_creative
      dockerfile: Dockerfile
    container_name: agent-creative
    profiles: [debate]
    expose:
      - "9403"
    environment:
      PORT: "9403"
      ANTHROPIC_API_KEY: "${DEBATE_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
      MODEL: "claude-haiku-4-5-20251001"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9403/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent-judge:
    build:
      context: ./agents/debate/agent_judge
      dockerfile: Dockerfile
    container_name: agent-judge
    profiles: [debate]
    expose:
      - "9404"
    environment:
      PORT: "9404"
      ANTHROPIC_API_KEY: "${DEBATE_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}"
      MODEL: "claude-sonnet-4-6"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9404/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Temporal — durable execution runtime (profile: temporal)
  # Enable with: docker compose --profile temporal up -d
  # ============================================================

  temporal-frontend:
    image: temporalio/auto-setup:1.25.2
    container_name: temporal-frontend
    profiles: [temporal]
    expose:
      - "7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${THE_M_DB_USER:-them}
      - POSTGRES_PWD=${THE_M_DB_PASSWORD:-them_secret}
      - POSTGRES_SEEDS=them-postgres
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - LOG_LEVEL=warn
    networks:
      - them-network
    depends_on:
      them-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # temporal-frontend binds to the container's Docker bridge IP, not 127.0.0.1.
      # Use $(hostname -i) to get the actual bound IP for the nc check.
      test: ["CMD-SHELL", "nc -z $(hostname -i | awk '{print $1}') 7233 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: temporal-ui
    profiles: [temporal]
    expose:
      - "8080"
    environment:
      - TEMPORAL_ADDRESS=temporal-frontend:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3111
      - TEMPORAL_UI_PUBLIC_PATH=/temporal
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-temporal-ui.rule=PathPrefix(`/temporal`)"
      - "traefik.http.routers.them-temporal-ui.entrypoints=web"
      - "traefik.http.routers.them-temporal-ui.priority=150"
      - "traefik.http.routers.them-temporal-ui.service=them-temporal-ui-svc"
      - "traefik.http.services.them-temporal-ui-svc.loadbalancer.server.port=8080"
    networks:
      - them-network
    depends_on:
      - temporal-frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    container_name: temporal-admin-tools
    profiles: [temporal]
    entrypoint: ["sleep", "infinity"]
    environment:
      - TEMPORAL_ADDRESS=temporal-frontend:7233
      - TEMPORAL_CLI_ADDRESS=temporal-frontend:7233
    networks:
      - them-network
    depends_on:
      - temporal-frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Python Temporal worker — RETIRED. Behind profiles: [legacy] only.
  # Go worker (them-go-worker in docker-compose.dev.yml) is the future active path.
  # --profile temporal starts Temporal infrastructure only (temporal-frontend, temporal-ui,
  # temporal-admin-tools). It does NOT start this Python worker.
  them-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: them-worker
    profiles: [legacy]
    volumes:
      - .:/app
      - ./data/them-logs:/app/logs
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_HOST: "them-postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "them"
      DATABASE_USER: ${THE_M_DB_USER:-them}
      DATABASE_PASSWORD: ${THE_M_DB_PASSWORD:-them_secret}
      REDIS_HOST: "them-redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_ENABLED: "true"
      REDIS_SSL: "false"
      AUTH_SERVICE_URL: "http://them-auth-go:8703"
      SECRET_KEY: ${THE_M_SECRET_KEY:-change-this-secret-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: "json"
      TEMPORAL_ENABLED: "true"
      TEMPORAL_HOST: "temporal-frontend:7233"
      TEMPORAL_NAMESPACE: "default"
      TEMPORAL_TASK_QUEUE: "them-orchestration"
    networks:
      - them-network
    depends_on:
      them-postgres:
        condition: service_healthy
      them-redis:
        condition: service_healthy
      them-auth-go:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ── Vision Agent — Location Visualizer ──────────────────────────────────────
  vision-agent:
    build:
      context: ./agents/vision_agent
      dockerfile: Dockerfile
    container_name: vision-agent
    expose:
      - "9100"
    environment:
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      FAL_API_KEY: "${FAL_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PORT: "9100"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/.well-known/agent-card.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── LiveKit — WebRTC SFU (profile: voice) ───────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.8.2
    container_name: livekit
    profiles: [voice]
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7882:7882/udp"
    expose:
      - "7880"
      - "7881"
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-livekit.rule=PathPrefix(`/livekit`)"
      - "traefik.http.routers.them-livekit.entrypoints=web"
      - "traefik.http.routers.them-livekit.priority=100"
      - "traefik.http.routers.them-livekit.service=them-livekit-svc"
      - "traefik.http.routers.them-livekit.middlewares=livekit-strip"
      - "traefik.http.middlewares.livekit-strip.stripprefix.prefixes=/livekit"
      - "traefik.http.services.them-livekit-svc.loadbalancer.server.port=7880"
    networks:
      - them-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── LiveKit Agent — WebRTC voice bridge (profile: voice) ─────────────────────
  livekit-agent:
    build:
      context: ./agents/livekit_agent
      dockerfile: Dockerfile
    container_name: livekit-agent
    profiles: [voice]
    environment:
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      THEM_BRIDGE_WS: "ws://them-bridge:8001"
    networks:
      - them-network
    depends_on:
      - livekit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Go Bridge — active API gateway (Python permanently retired) ──────────────
  # Go serves all routes. Python bridge is behind profiles: [legacy] and must not start.
  # ============================================================
  # them-mcp-service — dedicated MCP Store service
  # Manages MCP server health checks, tool discovery, and tool
  # execution. Internal only — not exposed through Traefik.
  # Horizontally scalable: leader election (Redis SET NX) ensures
  # only one replica runs the health loop; all replicas handle
  # POST /internal/execute as stateless HTTP servers.
  # ============================================================
  them-mcp-service:
    build:
      context: .
      dockerfile: Dockerfile.mcp-service
    container_name: them-mcp-service
    ports: []
    environment:
      - APP_PORT=8010
      - APP_ENV=development
      - THE_M_INSTANCE_ID=mcp-service-1
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - MCP_HEALTH_INTERVAL_SECONDS=60
      - MCP_ALLOW_HTTP=true
      - MCP_ALLOW_STDIO=false
      - LOG_FORMAT=json
    networks:
      - them-network
    depends_on:
      them-postgres:
        condition: service_healthy
      them-redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  them-go-bridge:
    build:
      context: .
      dockerfile: Dockerfile.go
    container_name: them-go-bridge
    ports: []
    environment:
      - APP_PORT=8002
      - APP_ENV=development
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - THE_M_INSTANCE_ID=go-bridge-1
      - LOG_FORMAT=json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_HOST_PORT=temporal-frontend:7233
      - JWT_PUBLIC_KEY_PEM=${JWT_PUBLIC_KEY_PEM:-}
      - MCP_SERVICE_URL=http://them-mcp-service:8010
    networks:
      - them-network
    depends_on:
      - them-postgres
      - them-redis
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      # ── Go service definition ───────────────────────────────────────────────
      - "traefik.http.services.them-go-bridge-svc.loadbalancer.server.port=8002"
      - "traefik.http.services.them-go-bridge-svc.loadbalancer.healthcheck.path=/health/live"
      - "traefik.http.services.them-go-bridge-svc.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.them-go-bridge-svc.loadbalancer.healthcheck.timeout=3s"
      # ── /ws/dashboard → Go dashboard WebSocket handler (priority 150 > Python ws 100)
      - "traefik.http.routers.them-go-ws-dashboard.rule=Path(`/ws/dashboard`)"
      - "traefik.http.routers.them-go-ws-dashboard.entrypoints=web"
      - "traefik.http.routers.them-go-ws-dashboard.priority=150"
      - "traefik.http.routers.them-go-ws-dashboard.service=them-go-bridge-svc"
      # ── Wave 1: /health/live and /health/ready (priority 130 beats Python's 90)
      # Go health handlers live at /health/live and /health/ready only.
      # Do NOT claim bare /health — Python serves that; we don't want a 404 from Go.
      - "traefik.http.routers.them-go-health-sub.rule=PathPrefix(`/health/live`) || PathPrefix(`/health/ready`)"
      - "traefik.http.routers.them-go-health-sub.entrypoints=web"
      - "traefik.http.routers.them-go-health-sub.priority=130"
      - "traefik.http.routers.them-go-health-sub.service=them-go-bridge-svc"
      # ── Wave 1: GET-only admin reads (priority 110 beats Python's 100) ─────
      # Go serves read-only admin endpoints; Python still handles all writes.
      # Runs: all GET sub-paths under /api/v1/runs (list, get-by-id, stats, contexts, context artifacts, tasks, artifacts).
      - "traefik.http.routers.them-go-admin-reads.rule=(PathPrefix(`/api/v1/admin/agents`) || PathPrefix(`/api/v1/admin/orchestrators`) || PathPrefix(`/api/v1/admin/applications`) || PathPrefix(`/api/v1/runs`)) && Method(`GET`)"
      - "traefik.http.routers.them-go-admin-reads.entrypoints=web"
      - "traefik.http.routers.them-go-admin-reads.priority=110"
      - "traefik.http.routers.them-go-admin-reads.service=them-go-bridge-svc"
      # ── system-agents — GET + PUT + POST /{role}/test-llm ───────────────────
      - "traefik.http.routers.them-go-system-agents.rule=PathPrefix(`/api/v1/admin/system-agents`)"
      - "traefik.http.routers.them-go-system-agents.entrypoints=web"
      - "traefik.http.routers.them-go-system-agents.priority=120"
      - "traefik.http.routers.them-go-system-agents.service=them-go-bridge-svc"
      # ── Wave 6: /api/v1/admin/monitoring-config — GET + PUT ─────────────────
      # Python owns /api/v1 at priority 100; Go claims monitoring-config at 120.
      # ROLLBACK: remove this router block (them-go-monitoring-config).
      - "traefik.http.routers.them-go-monitoring-config.rule=Path(`/api/v1/admin/monitoring-config`)"
      - "traefik.http.routers.them-go-monitoring-config.entrypoints=web"
      - "traefik.http.routers.them-go-monitoring-config.priority=120"
      - "traefik.http.routers.them-go-monitoring-config.service=them-go-bridge-svc"
      # ── Wave 6: /api/v1/admin/llm-providers/routing/config — GET + PUT ──────
      # Literal path — does not conflict with /llm-providers/{id} (Python keeps that).
      # ROLLBACK: remove this router block (them-go-llm-routing-config).
      - "traefik.http.routers.them-go-llm-routing-config.rule=Path(`/api/v1/admin/llm-providers/routing/config`)"
      - "traefik.http.routers.them-go-llm-routing-config.entrypoints=web"
      - "traefik.http.routers.them-go-llm-routing-config.priority=120"
      - "traefik.http.routers.them-go-llm-routing-config.service=them-go-bridge-svc"
      # ── Wave 7: /api/v1/admin/llm-providers CRUD — GET/POST/PATCH/DELETE ─────
      # Excludes /routing/config (already owned by them-go-llm-routing-config at 120).
      # The exclusion is belt-and-suspenders: Traefik PathPrefix+!Path beats PathPrefix alone.
      # ROLLBACK: remove this router block (them-go-llm-providers).
      - "traefik.http.routers.them-go-llm-providers.rule=PathPrefix(`/api/v1/admin/llm-providers`) && !Path(`/api/v1/admin/llm-providers/routing/config`)"
      - "traefik.http.routers.them-go-llm-providers.entrypoints=web"
      - "traefik.http.routers.them-go-llm-providers.priority=120"
      - "traefik.http.routers.them-go-llm-providers.service=them-go-bridge-svc"
      # ── Wave 2a: agents writes ─────────────────────────────────────────────────
      - "traefik.http.routers.them-go-agents-create.rule=Path(`/api/v1/admin/agents`) && Method(`POST`)"
      - "traefik.http.routers.them-go-agents-create.entrypoints=web"
      - "traefik.http.routers.them-go-agents-create.priority=115"
      - "traefik.http.routers.them-go-agents-create.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-agents-update.rule=PathRegexp(`^/api/v1/admin/agents/[^/]+$$`) && (Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))"
      - "traefik.http.routers.them-go-agents-update.entrypoints=web"
      - "traefik.http.routers.them-go-agents-update.priority=115"
      - "traefik.http.routers.them-go-agents-update.service=them-go-bridge-svc"
      # ── Wave 2b: orchestrators writes ─────────────────────────────────────────
      - "traefik.http.routers.them-go-orchs-create.rule=Path(`/api/v1/admin/orchestrators`) && Method(`POST`)"
      - "traefik.http.routers.them-go-orchs-create.entrypoints=web"
      - "traefik.http.routers.them-go-orchs-create.priority=115"
      - "traefik.http.routers.them-go-orchs-create.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-orchs-update.rule=PathRegexp(`^/api/v1/admin/orchestrators/[^/]+$$`) && (Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))"
      - "traefik.http.routers.them-go-orchs-update.entrypoints=web"
      - "traefik.http.routers.them-go-orchs-update.priority=115"
      - "traefik.http.routers.them-go-orchs-update.service=them-go-bridge-svc"
      # ── Wave 2c: applications writes ──────────────────────────────────────────
      - "traefik.http.routers.them-go-apps-create.rule=Path(`/api/v1/admin/applications`) && Method(`POST`)"
      - "traefik.http.routers.them-go-apps-create.entrypoints=web"
      - "traefik.http.routers.them-go-apps-create.priority=115"
      - "traefik.http.routers.them-go-apps-create.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-apps-update.rule=PathRegexp(`^/api/v1/admin/applications/[^/]+$$`) && (Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))"
      - "traefik.http.routers.them-go-apps-update.entrypoints=web"
      - "traefik.http.routers.them-go-apps-update.priority=115"
      - "traefik.http.routers.them-go-apps-update.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-eps-writes.rule=PathRegexp(`^/api/v1/admin/applications/[^/]+/entry-points(/[^/]+)?$$`) && (Method(`POST`) || Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))"
      - "traefik.http.routers.them-go-eps-writes.entrypoints=web"
      - "traefik.http.routers.them-go-eps-writes.priority=115"
      - "traefik.http.routers.them-go-eps-writes.service=them-go-bridge-svc"
      # ── Wave 8: applications sub-routes ───────────────────────────────────────
      - "traefik.http.routers.them-go-apps-subroutes.rule=PathRegexp(`^/api/v1/admin/applications/[^/]+/.+$$`) && (Method(`GET`) || Method(`PUT`) || Method(`POST`) || Method(`PATCH`) || Method(`DELETE`))"
      - "traefik.http.routers.them-go-apps-subroutes.entrypoints=web"
      - "traefik.http.routers.them-go-apps-subroutes.priority=115"
      - "traefik.http.routers.them-go-apps-subroutes.service=them-go-bridge-svc"
      # ── Wave 8: Agent Store actions (discover / test / security-scan) ─────────
      - "traefik.http.routers.them-go-agents-actions.rule=PathRegexp(`^/api/v1/admin/agents(/discover|/[^/]+/test|/[^/]+/security-scan)$$`) && Method(`POST`)"
      - "traefik.http.routers.them-go-agents-actions.entrypoints=web"
      - "traefik.http.routers.them-go-agents-actions.priority=116"
      - "traefik.http.routers.them-go-agents-actions.service=them-go-bridge-svc"
      # ── Wave 2d: runs signal ───────────────────────────────────────────────────
      - "traefik.http.routers.them-go-runs-signal.rule=PathRegexp(`^/api/v1/runs/[^/]+/signal$$`) && Method(`POST`)"
      - "traefik.http.routers.them-go-runs-signal.entrypoints=web"
      - "traefik.http.routers.them-go-runs-signal.priority=115"
      - "traefik.http.routers.them-go-runs-signal.service=them-go-bridge-svc"
      # ── Wave 2e: runs sub-resources (tasks + artifacts) → Go ─────────────────
      - "traefik.http.routers.them-go-runs-sub.rule=PathRegexp(`^/api/v1/runs/[^/]+/(tasks|artifacts)$$`) && Method(`GET`)"
      - "traefik.http.routers.them-go-runs-sub.entrypoints=web"
      - "traefik.http.routers.them-go-runs-sub.priority=115"
      - "traefik.http.routers.them-go-runs-sub.service=them-go-bridge-svc"
      # ── Wave 2f: runs writes (cancel, delete, bulk-delete) → Go ──────────────
      - "traefik.http.routers.them-go-runs-cancel.rule=PathRegexp(`^/api/v1/runs/[^/]+/cancel$$`) && Method(`PATCH`)"
      - "traefik.http.routers.them-go-runs-cancel.entrypoints=web"
      - "traefik.http.routers.them-go-runs-cancel.priority=116"
      - "traefik.http.routers.them-go-runs-cancel.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-runs-delete.rule=PathRegexp(`^/api/v1/runs/[^/]+$$`) && Method(`DELETE`)"
      - "traefik.http.routers.them-go-runs-delete.entrypoints=web"
      - "traefik.http.routers.them-go-runs-delete.priority=114"
      - "traefik.http.routers.them-go-runs-delete.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-runs-bulk-delete.rule=Path(`/api/v1/runs/bulk-delete`) && Method(`POST`)"
      - "traefik.http.routers.them-go-runs-bulk-delete.entrypoints=web"
      - "traefik.http.routers.them-go-runs-bulk-delete.priority=116"
      - "traefik.http.routers.them-go-runs-bulk-delete.service=them-go-bridge-svc"
      # ── Wave 4a: /apps/{slug}/ws → Go WS handler ──────────────────────────────
      - "traefik.http.routers.them-go-apps-ws.rule=PathRegexp(`^/apps/[^/]+/ws$$`) && Method(`GET`)"
      - "traefik.http.routers.them-go-apps-ws.entrypoints=web"
      - "traefik.http.routers.them-go-apps-ws.priority=120"
      - "traefik.http.routers.them-go-apps-ws.service=them-go-bridge-svc"
      # ── Wave 4b: /apps/{slug}/sse → Go SSE handler ────────────────────────────
      - "traefik.http.routers.them-go-apps-sse.rule=PathRegexp(`^/apps/[^/]+/sse$$`) && (Method(`GET`) || Method(`POST`))"
      - "traefik.http.routers.them-go-apps-sse.entrypoints=web"
      - "traefik.http.routers.them-go-apps-sse.priority=120"
      - "traefik.http.routers.them-go-apps-sse.service=them-go-bridge-svc"
      # ── Wave 4c: /ws/orchestrate/{app}/{ep} (two-segment) → Go ───────────────
      - "traefik.http.routers.them-go-ws-two-seg.rule=PathRegexp(`^/ws/orchestrate/[^/]+/[^/]+$$`) && Method(`GET`)"
      - "traefik.http.routers.them-go-ws-two-seg.entrypoints=web"
      - "traefik.http.routers.them-go-ws-two-seg.priority=120"
      - "traefik.http.routers.them-go-ws-two-seg.service=them-go-bridge-svc"
      # ── Wave 4d: /sse/orchestrate/{app}/{ep} (two-segment) → Go ─────────────
      - "traefik.http.routers.them-go-sse-two-seg.rule=PathRegexp(`^/sse/orchestrate/[^/]+/[^/]+$$`) && (Method(`GET`) || Method(`POST`))"
      - "traefik.http.routers.them-go-sse-two-seg.entrypoints=web"
      - "traefik.http.routers.them-go-sse-two-seg.priority=120"
      - "traefik.http.routers.them-go-sse-two-seg.service=them-go-bridge-svc"
      # ── Wave 5: /api/v1/admin/tokens — full CRUD ──────────────────────────────
      - "traefik.http.routers.them-go-tokens.rule=PathPrefix(`/api/v1/admin/tokens`)"
      - "traefik.http.routers.them-go-tokens.entrypoints=web"
      - "traefik.http.routers.them-go-tokens.priority=120"
      - "traefik.http.routers.them-go-tokens.service=them-go-bridge-svc"
      # ── Wave 5: /api/v1/admin/sessions — list + disconnect ────────────────────
      - "traefik.http.routers.them-go-sessions.rule=PathPrefix(`/api/v1/admin/sessions`)"
      - "traefik.http.routers.them-go-sessions.entrypoints=web"
      - "traefik.http.routers.them-go-sessions.priority=120"
      - "traefik.http.routers.them-go-sessions.service=them-go-bridge-svc"
      # ── Node type registry: /api/v1/admin/node-types — canvas metadata ─────────
      - "traefik.http.routers.them-go-node-types.rule=PathPrefix(`/api/v1/admin/node-types`)"
      - "traefik.http.routers.them-go-node-types.entrypoints=web"
      - "traefik.http.routers.them-go-node-types.priority=120"
      - "traefik.http.routers.them-go-node-types.service=them-go-bridge-svc"
      # ── Debug proxy: /api/v1/admin/debug-proxy — server-side HTTP relay for canvas debug ──
      - "traefik.http.routers.them-go-debug-proxy.rule=Path(`/api/v1/admin/debug-proxy`)"
      - "traefik.http.routers.them-go-debug-proxy.entrypoints=web"
      - "traefik.http.routers.them-go-debug-proxy.priority=121"
      - "traefik.http.routers.them-go-debug-proxy.service=them-go-bridge-svc"
      # ── Transform: /api/v1/admin/transform-* — function catalog, test runner, AI assist stub ──
      - "traefik.http.routers.them-go-transform.rule=PathPrefix(`/api/v1/admin/transform-`)"
      - "traefik.http.routers.them-go-transform.entrypoints=web"
      - "traefik.http.routers.them-go-transform.priority=121"
      - "traefik.http.routers.them-go-transform.service=them-go-bridge-svc"
      # ── Phase D: /api/v1/admin/component-definitions — registry read ──────────
      - "traefik.http.routers.them-go-component-defs.rule=PathPrefix(`/api/v1/admin/component-definitions`)"
      - "traefik.http.routers.them-go-component-defs.entrypoints=web"
      - "traefik.http.routers.them-go-component-defs.priority=120"
      - "traefik.http.routers.them-go-component-defs.service=them-go-bridge-svc"
      # ── Phase 2: /api/v1/admin/agent-definitions — Canvas A2A Agent Builder CRUD ──
      - "traefik.http.routers.them-go-agent-defs.rule=PathPrefix(`/api/v1/admin/agent-definitions`)"
      - "traefik.http.routers.them-go-agent-defs.entrypoints=web"
      - "traefik.http.routers.them-go-agent-defs.priority=120"
      - "traefik.http.routers.them-go-agent-defs.service=them-go-bridge-svc"
      # ── Phase 3: /api/v1/admin/applications/{id}/agent-bindings — credential bindings ──
      - "traefik.http.routers.them-go-agent-bindings.rule=PathRegexp(`^/api/v1/admin/applications/[^/]+/agent-bindings(/[^/]+)?$`)"
      - "traefik.http.routers.them-go-agent-bindings.entrypoints=web"
      - "traefik.http.routers.them-go-agent-bindings.priority=121"
      - "traefik.http.routers.them-go-agent-bindings.service=them-go-bridge-svc"
      # ── A2A server: /a2a — Go A2A JSON-RPC handler (was pointing at dead Python bridge) ──
      - "traefik.http.routers.them-go-a2a.rule=PathPrefix(`/a2a`)"
      - "traefik.http.routers.them-go-a2a.entrypoints=web"
      - "traefik.http.routers.them-go-a2a.priority=120"
      - "traefik.http.routers.them-go-a2a.service=them-go-bridge-svc"
      # ── MCP Store: mcp-servers CRUD + app credentials ─────────────────────
      - "traefik.http.routers.them-go-mcp-servers.rule=PathPrefix(`/api/v1/admin/mcp-servers`)"
      - "traefik.http.routers.them-go-mcp-servers.entrypoints=web"
      - "traefik.http.routers.them-go-mcp-servers.priority=115"
      - "traefik.http.routers.them-go-mcp-servers.service=them-go-bridge-svc"
      - "traefik.http.routers.them-go-mcp-credentials.rule=PathRegexp(`^/api/v1/admin/applications/[^/]+/mcp-credentials(/[^/]+)?$$`)"
      - "traefik.http.routers.them-go-mcp-credentials.entrypoints=web"
      - "traefik.http.routers.them-go-mcp-credentials.priority=116"
      - "traefik.http.routers.them-go-mcp-credentials.service=them-go-bridge-svc"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── A2A Agent Runtime — interprets canvas-compiled AgentSpecs ───────────────
  # Profile: agents. Replicas: 2 (no container_name — allows multiple instances).
  # Port 9300 is internal only — never exposed through Traefik.
  # Phase 1: invocation context via X-Them-* headers (Docker network only).
  # Phase 3: upgrade to signed JWT (THE_M_INVOCATION_JWT_KEY).
  them-agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile.agent-runtime
    deploy:
      replicas: 2
    ports: []
    environment:
      - APP_PORT=9300
      - APP_ENV=development
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - THE_M_INVOCATION_JWT_KEY=${THE_M_INVOCATION_JWT_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - them-network
    depends_on:
      - them-postgres
      - them-redis
    profiles:
      - agents
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
