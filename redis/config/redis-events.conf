# the-M events Redis — queue between producers and the event-writer
# Container: them-redis-events (profile: events). Separate from them-redis on purpose:
# the main instance uses allkeys-lru, which would silently evict queued events.
# Design: docs/OBSERVABILITY_STORAGE_DESIGN.md (§4, §6.1)

# Persistence — AOF, fsync every second (bounded loss window: ~1s)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Snapshots as a secondary safety net
save 300 1
save 60 1000

# Memory — NEVER evict. When full, writes are rejected so producers can apply
# the §5 rules (drop operational events and count them; audit uses the PG outbox).
maxmemory 512mb
maxmemory-policy noeviction

# Stream retention — ACK does NOT remove entries (XACK preserves for replay/recovery).
# Explicit trimming via XTRIM or MAXLEN is application responsibility. The event-writer
# consumer MUST NOT trim based on ACK count alone — it must verify zero pending messages
# (XPENDING) before removing entries, otherwise recovery from consumer failure would lose data.
# Production deployments should implement time-based or size-based trim outside the consumer.

loglevel notice
protected-mode no
