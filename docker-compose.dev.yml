version: "3.9"
# docker-compose.dev.yml — Local Linux development overlay
#
# Replaces: docker-compose.local.yml
#
# Usage:
#   docker compose --project-name them_gateway -f docker-compose.yml -f docker-compose.dev.yml --profile temporal up -d
#   docker compose --project-name them_gateway -f docker-compose.yml -f docker-compose.dev.yml --profile temporal --profile legacy up -d  # Python bridge (retired, emergency only)
#
# Active stack (Go-only, Python permanently retired):
#   - them-go-bridge owns all API routes (/api/v1, /ws, /sse, /health, /apps, /a2a)
#   - them-bridge (Python) is behind profiles: [legacy] — does NOT start by default
#   - Frontend depends on them-go-bridge (not them-bridge)
#   - proxy-network is created locally (not external) — no infra-traefik
#   - Frontend runs in dev mode with source bind mount (Turbopack HMR)
#   - Data stored in named Docker volumes (same as Hetzner, avoids UID issues on Linux)
#   - Auth: them-auth-go at 8703

networks:
  # them-proxy-local already exists from previous deployment; mark external to reuse.
  # On a fresh install where it doesn't exist yet, change external to false (or remove this override).
  proxy-network:
    name: them-proxy-local
    external: true

services:

  # ── Postgres: named volume (avoids UID/GID issues on Linux) ──────────────────
  them-postgres:
    volumes:
      - them-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  # ── Redis: named volume ───────────────────────────────────────────────────────
  them-redis:
    volumes:
      - them-redis-data:/data
      - ./redis/config/redis.conf:/etc/redis/redis.conf:ro

  # ── Python bridge: RETIRED — behind profiles: [legacy] ──────────────────────
  # them-bridge does NOT start in default or --profile go mode.
  # This overlay stanza only supplies the source bind mount if --profile legacy is used
  # (emergency/archaeology only). Python is permanently retired.
  them-bridge:
    volumes:
      - .:/app
      - them-logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-api.rule=PathPrefix(`/api/v1`)"
      - "traefik.http.routers.them-api.entrypoints=web"
      - "traefik.http.routers.them-api.priority=100"
      - "traefik.http.routers.them-api.service=them-bridge-svc"
      - "traefik.http.routers.them-ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.them-ws.entrypoints=web"
      - "traefik.http.routers.them-ws.priority=100"
      - "traefik.http.routers.them-ws.service=them-bridge-svc"
      - "traefik.http.routers.them-health.rule=PathPrefix(`/health`)"
      - "traefik.http.routers.them-health.entrypoints=web"
      - "traefik.http.routers.them-health.priority=90"
      - "traefik.http.routers.them-health.service=them-bridge-svc"
      - "traefik.http.routers.them-apps.rule=PathPrefix(`/apps`)"
      - "traefik.http.routers.them-apps.entrypoints=web"
      - "traefik.http.routers.them-apps.priority=100"
      - "traefik.http.routers.them-apps.service=them-bridge-svc"
      - "traefik.http.routers.them-a2a.rule=PathPrefix(`/a2a`)"
      - "traefik.http.routers.them-a2a.entrypoints=web"
      - "traefik.http.routers.them-a2a.priority=100"
      - "traefik.http.routers.them-a2a.service=them-go-bridge-svc"
      - "traefik.http.services.them-bridge-svc.loadbalancer.server.port=8001"
      - "traefik.http.services.them-bridge-svc.loadbalancer.healthcheck.path=/health/live"
      - "traefik.http.services.them-bridge-svc.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.them-bridge-svc.loadbalancer.healthcheck.timeout=3s"

  # ── Frontend: dev mode with source bind mount (Turbopack HMR) ────────────────
  # Overrides base: prod Dockerfile → dev Dockerfile, adds source mounts
  them-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: "3200"
      THE_M_API_URL: "http://them-traefik:8088"
      THE_M_AUTH_URL: "http://them-auth-go:8703"
      NEXT_PUBLIC_BRIDGE_WS_URL: ""
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.them-ui.entrypoints=web"
      - "traefik.http.routers.them-ui.priority=10"
      - "traefik.http.routers.them-ui.service=them-ui-svc"
      - "traefik.http.services.them-ui-svc.loadbalancer.server.port=3200"

  # ── Temporal UI ───────────────────────────────────────────────────────────────
  temporal-ui:
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-temporal-ui.rule=PathPrefix(`/temporal`)"
      - "traefik.http.routers.them-temporal-ui.entrypoints=web"
      - "traefik.http.routers.them-temporal-ui.priority=150"
      - "traefik.http.routers.them-temporal-ui.service=them-temporal-ui-svc"
      - "traefik.http.services.them-temporal-ui-svc.loadbalancer.server.port=8080"

  # ── Go Temporal Worker 1 ───────────────────────────────────────────────────────
  them-go-worker:
    build:
      context: .
      dockerfile: Dockerfile.go-worker
    container_name: them-go-worker
    environment:
      - THE_M_INSTANCE_ID=go-worker-1
      - APP_ENV=production
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - REDIS_DB=0
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_HOST_PORT=temporal-frontend:7233
      - WORKER_TASK_QUEUE=them-orchestration-go
      - MCP_SERVICE_URL=http://them-mcp-service:8010
    networks:
      - them-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ── Go Temporal Worker 2 ───────────────────────────────────────────────────────
  them-go-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.go-worker
    container_name: them-go-worker-2
    environment:
      - THE_M_INSTANCE_ID=go-worker-2
      - APP_ENV=production
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - REDIS_DB=0
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_HOST_PORT=temporal-frontend:7233
      - WORKER_TASK_QUEUE=them-orchestration-go
      - MCP_SERVICE_URL=http://them-mcp-service:8010
    networks:
      - them-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

# ── Named volumes (Docker manages ownership — no UID/GID issues on Linux) ─────
# external: true allows re-use of volumes created by a previous project invocation
# (e.g. after project name changes or stack migrations).
volumes:
  them-postgres-data:
    name: them-postgres-data
    external: true
  them-redis-data:
    name: them-redis-data
    external: true
  them-logs:
    name: them-logs
    external: true
