version: "3.9"
# docker-compose.dev.yml — Local Linux development overlay
#
# Replaces: docker-compose.local.yml
#
# Usage:
#   docker compose --project-name them_gateway -f docker-compose.yml -f docker-compose.dev.yml --profile temporal up -d
#
# Active stack (Go-only, Python permanently retired):
#   - them-go-bridge owns all API routes (/api/v1, /ws, /sse, /health, /apps, /a2a)
#   - Frontend depends on them-go-bridge (not them-bridge)
#   - proxy-network is created locally (not external) — no infra-traefik
#   - Frontend runs in dev mode with source bind mount (Turbopack HMR)
#   - Data stored in named Docker volumes (same as Hetzner, avoids UID issues on Linux)
#   - Auth: them-auth-go at 8703

networks:
  # them-proxy-local already exists from previous deployment; mark external to reuse.
  # On a fresh install where it doesn't exist yet, change external to false (or remove this override).
  proxy-network:
    name: them-proxy-local
    external: true

services:

  # ── Postgres: named volume (avoids UID/GID issues on Linux) ──────────────────
  them-postgres:
    volumes:
      - them-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  # ── Redis: named volume ───────────────────────────────────────────────────────
  them-redis:
    volumes:
      - them-redis-data:/data
      - ./redis/config/redis.conf:/etc/redis/redis.conf:ro

  # ── Frontend: dev mode with source bind mount (Turbopack HMR) ────────────────
  # Overrides base: prod Dockerfile → dev Dockerfile, adds source mounts
  them-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: "3200"
      THE_M_API_URL: "http://them-traefik:8088"
      THE_M_AUTH_URL: "http://them-auth-go:8703"
      NEXT_PUBLIC_BRIDGE_WS_URL: ""
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.them-ui.entrypoints=web"
      - "traefik.http.routers.them-ui.priority=10"
      - "traefik.http.routers.them-ui.service=them-ui-svc"
      - "traefik.http.services.them-ui-svc.loadbalancer.server.port=3200"

  # ── Temporal UI ───────────────────────────────────────────────────────────────
  temporal-ui:
    labels:
      - "traefik.enable=true"
      - "traefik-instance=them"
      - "traefik.docker.network=them-network"
      - "traefik.http.routers.them-temporal-ui.rule=PathPrefix(`/temporal`)"
      - "traefik.http.routers.them-temporal-ui.entrypoints=web"
      - "traefik.http.routers.them-temporal-ui.priority=150"
      - "traefik.http.routers.them-temporal-ui.service=them-temporal-ui-svc"
      - "traefik.http.services.them-temporal-ui-svc.loadbalancer.server.port=8080"

  # ── Go Temporal Worker 1 ───────────────────────────────────────────────────────
  them-go-worker:
    build:
      context: .
      dockerfile: Dockerfile.go-worker
    container_name: them-go-worker
    environment:
      - THE_M_INSTANCE_ID=go-worker-1
      - APP_ENV=production
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - REDIS_DB=0
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_HOST_PORT=temporal-frontend:7233
      - WORKER_TASK_QUEUE=them-orchestration-go
      - MCP_SERVICE_URL=http://them-mcp-service:8010
    networks:
      - them-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ── Go Temporal Worker 2 ───────────────────────────────────────────────────────
  them-go-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.go-worker
    container_name: them-go-worker-2
    environment:
      - THE_M_INSTANCE_ID=go-worker-2
      - APP_ENV=production
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - REDIS_DB=0
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_HOST_PORT=temporal-frontend:7233
      - WORKER_TASK_QUEUE=them-orchestration-go
      - MCP_SERVICE_URL=http://them-mcp-service:8010
    networks:
      - them-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ── Canvas DAG Worker ─────────────────────────────────────────────────────────
  # Polls "canvas-dag-nodes" Temporal task queue and executes canvas agent DAG
  # steps as Temporal activities. Starts only with --profile temporal.
  # NOTE: them-agent-runtime needs TEMPORAL_ENABLED=true only when running with
  # the temporal profile. That override lives in docker-compose.temporal.yml —
  # loaded explicitly alongside --profile temporal. See startup commands below.
  them-clamd:
    image: clamav/clamav:stable
    container_name: them-clamd
    profiles: [security]
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - them-network
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s   # ClamAV downloads ~300MB virus defs on first boot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  them-middleware-worker:
    build:
      context: .
      dockerfile: Dockerfile.middleware-worker
    container_name: them-middleware-worker
    profiles: [security]
    environment:
      - THE_M_INSTANCE_ID=middleware-worker-1
      - APP_ENV=production
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - REDIS_DB=0
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Use TCP to reach clamd — Unix socket cross-namespace doesn't work in Docker.
      - CLAMAV_SOCKET=them-clamd:3310
      - MIDDLEWARE_WORKER_CONCURRENCY=${MIDDLEWARE_WORKER_CONCURRENCY:-8}
      - MIDDLEWARE_POLL_INTERVAL_MS=${MIDDLEWARE_POLL_INTERVAL_MS:-500}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    networks:
      - them-network
    depends_on:
      - them-postgres
      - them-redis
      - them-clamd
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  them-dag-worker:
    build:
      context: .
      dockerfile: Dockerfile.dag-worker
    container_name: them-dag-worker
    profiles: [temporal]
    environment:
      - THE_M_INSTANCE_ID=dag-worker-1
      - APP_ENV=production
      - DATABASE_HOST=them-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=them
      - DATABASE_USER=${THE_M_DB_USER:-them}
      - DATABASE_PASSWORD=${THE_M_DB_PASSWORD:-them_secret}
      - REDIS_HOST=them-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${THE_M_REDIS_PASSWORD:-}
      - REDIS_DB=0
      - SECRET_KEY=${THE_M_SECRET_KEY:-change-this-secret-key}
      - JWT_SECRET=${THE_M_JWT_SECRET:-}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_HOST_PORT=temporal-frontend:7233
      - DAG_WORKER_MAX_CONCURRENT_ACTIVITIES=${DAG_WORKER_MAX_CONCURRENT_ACTIVITIES:-50}
      - MCP_SERVICE_URL=http://them-mcp-service:8010
    networks:
      - them-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

# ── Named volumes (Docker manages ownership — no UID/GID issues on Linux) ─────
# external: true allows re-use of volumes created by a previous project invocation
# (e.g. after project name changes or stack migrations).
volumes:
  them-postgres-data:
    name: them-postgres-data
    external: true
  them-redis-data:
    name: them-redis-data
    external: true
  them-logs:
    name: them-logs
    external: true
  clamav-socket:
    name: them-clamav-socket
  clamav-db:
    name: them-clamav-db
